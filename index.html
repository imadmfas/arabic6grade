<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>أساسيات قواعد اللغة العربية — كتاب تفاعلي للسادس الإعدادي</title>
<meta name="description" content="كتاب تفاعلي ملوّن لأساسيات قواعد اللغة العربية للصف السادس الإعدادي: شرح متحرك وتدريبات واختبار شامل بتصحيح فوري. مجاني للطلبة والأساتذة.">
<meta name="theme-color" content="#1d2b53">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📗</text></svg>">
<style>
@font-face{font-family:Naskh;src:url(fonts/noto-naskh-arabic-arabic-500-normal.woff2) format('woff2');font-weight:400 500;font-display:swap}
@font-face{font-family:Naskh;src:url(fonts/noto-naskh-arabic-arabic-700-normal.woff2) format('woff2');font-weight:600 800;font-display:swap}
@font-face{font-family:Amiri;src:url(fonts/amiri-arabic-700-normal.woff2) format('woff2');font-weight:700;font-display:swap}
:root{--paper:#fffaf0;--ink:#2a2233;--muted:#6f6577;--ok:#17a34a;--bad:#e11d48;--gold:#f5b700;--uc:#e4572e;--u:6px;--bw:1000px;--bh:700px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{font-family:Naskh,'Noto Naskh Arabic','Segoe UI',Tahoma,sans-serif;color:var(--ink);
  background:radial-gradient(1200px 700px at 20% 10%,#3b2f6b 0,transparent 60%),radial-gradient(900px 600px at 90% 90%,#0f6e6e 0,transparent 60%),#1d2b53}
button{font-family:inherit;cursor:pointer}
#bgdots{position:fixed;inset:0;pointer-events:none;overflow:hidden}
#bgdots span{position:absolute;color:#ffffff14;font-family:Amiri;font-size:var(--s);animation:drift var(--d) linear infinite;animation-delay:var(--dl)}
@keyframes drift{from{transform:translateY(110vh) rotate(0)}to{transform:translateY(-20vh) rotate(40deg)}}

/* ---------- المسرح والكتاب ---------- */
#stage{position:fixed;inset:0 0 62px 0;display:flex;align-items:center;justify-content:center;touch-action:pan-y}
#book{position:relative;width:var(--bw);height:var(--bh);perspective:2800px;transition:transform .8s cubic-bezier(.6,.05,.3,1)}
#book.closed{transform:translateX(calc(var(--bw) / 4))}
#book.single.closed{transform:none}
.half{position:absolute;top:0;height:100%;width:50%}
.hR{right:0}.hL{left:0}
#book.single .half{width:100%;left:0;right:auto}
#book.single .pg-in{--pt:calc(var(--u)*3.4);--px:calc(var(--u)*3)}
.spine{position:absolute;top:1%;bottom:1%;left:calc(50% - 6px);width:12px;background:linear-gradient(90deg,#0003,#0000 40%,#0000 60%,#0003);z-index:4;pointer-events:none;border-radius:6px;transition:opacity .4s}
#book.closed .spine,#book.single .spine{opacity:0}
.page{position:absolute;inset:0;background:var(--paper);overflow:hidden;box-shadow:0 18px 40px #0006;display:flex;flex-direction:column}
.page.empty{background:transparent;box-shadow:none}
.sideR{border-radius:4px 14px 14px 4px}
.sideL{border-radius:14px 4px 4px 14px}
.sideS{border-radius:14px}
.sideR::after,.sideL::after{content:"";position:absolute;top:0;bottom:0;width:38px;pointer-events:none;z-index:3}
.sideR::after{left:0;background:linear-gradient(90deg,#0000002a,#0000)}
.sideL::after{right:0;background:linear-gradient(270deg,#0000002a,#0000)}
.page.empty::after{display:none}
.pg-in{--pt:calc(var(--u)*5);--px:calc(var(--u)*5.5);flex:1;overflow-y:auto;overflow-x:hidden;padding:var(--pt) var(--px) calc(var(--u)*3);scrollbar-width:thin;scrollbar-color:#c9b89a transparent;position:relative}
.folio{height:calc(var(--u)*5.5);display:flex;align-items:center;justify-content:center;font-size:calc(var(--u)*2.3);color:var(--muted);border-top:1px dashed #e4d6bb;margin:0 calc(var(--u)*5);flex:none}
.leaf{position:absolute;top:0;height:100%;width:50%;transform-style:preserve-3d;z-index:6;pointer-events:none}
#book.single .leaf{width:100%}
.leaf .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.leaf .face.back{transform:rotateY(180deg)}
.leaf .shade{position:absolute;inset:0;pointer-events:none;z-index:9;border-radius:inherit}
.corner{position:absolute;bottom:0;width:58px;height:58px;z-index:7;border:0;background:transparent;padding:0}
.corner.next{left:0}.corner.prev{right:0}
.corner i{position:absolute;bottom:0;width:0;height:0;transition:all .25s;filter:drop-shadow(0 0 4px #0003)}
.corner.next i{left:0;border-bottom:26px solid #e9dcc1;border-right:26px solid transparent}
.corner.prev i{right:0;border-bottom:26px solid #e9dcc1;border-left:26px solid transparent}
.corner:hover i{border-bottom-width:40px;border-right-width:40px;border-left-width:40px}
.corner.prev:hover i{border-right-width:0}.corner.next:hover i{border-left-width:0}

/* ---------- عناصر الصفحة ---------- */
.band{margin:calc(-1*var(--pt)) calc(-1*var(--px)) calc(var(--u)*3);padding:calc(var(--u)*3.2) var(--px) calc(var(--u)*2.6);background:linear-gradient(135deg,var(--uc),color-mix(in srgb,var(--uc) 60%,#1d2b53));color:#fff;position:relative;overflow:hidden}
.band::before{content:attr(data-ic);position:absolute;left:calc(var(--u)*3);top:50%;transform:translateY(-50%) rotate(-12deg);font-size:calc(var(--u)*9);opacity:.28}
.band small{display:block;font-size:calc(var(--u)*2.2);opacity:.9}
.band h2{margin:0;font-family:Amiri,Naskh,serif;font-size:calc(var(--u)*4.6);line-height:1.3}
h3.sec{font-size:calc(var(--u)*2.9);margin:calc(var(--u)*2.6) 0 calc(var(--u)*1.2);color:var(--uc);display:flex;align-items:center;gap:8px}
h3.sec::after{content:"";flex:1;height:2px;background:linear-gradient(270deg,transparent,color-mix(in srgb,var(--uc) 45%,transparent))}
p,li{font-size:calc(var(--u)*2.75);line-height:1.95}
.intro{font-size:calc(var(--u)*2.9);background:color-mix(in srgb,var(--uc) 10%,#fff);border-radius:12px;padding:calc(var(--u)*1.6) calc(var(--u)*2.2);margin:0 0 calc(var(--u)*1)}
ul.pts{list-style:none;padding:0;margin:0}
ul.pts li{position:relative;padding:calc(var(--u)*1.1) calc(var(--u)*4.6) calc(var(--u)*1.1) calc(var(--u)*1.4);margin:0 0 calc(var(--u)*1.2);background:#fff;border-radius:12px;box-shadow:0 2px 0 #eadfc9;cursor:pointer}
ul.pts li::before{content:attr(data-n);position:absolute;right:calc(var(--u)*1.2);top:calc(var(--u)*1.3);width:calc(var(--u)*2.8);height:calc(var(--u)*2.8);border-radius:50%;background:var(--uc);color:#fff;font-size:calc(var(--u)*1.8);display:grid;place-items:center;font-weight:700}
ul.pts li.glow{animation:glow 1s}
@keyframes glow{40%{box-shadow:0 0 0 4px color-mix(in srgb,var(--uc) 40%,transparent)}}
mark{background:none;color:inherit;font-weight:700;padding:0 2px;border-radius:4px;background-image:linear-gradient(transparent 62%,var(--hl) 62%);background-size:0 100%;background-repeat:no-repeat;background-position:right}
mark.m1{--hl:#ffd16699;color:#9a2b0c}
mark.m2{--hl:#7bdff299;color:#0b5d75}
.live mark{animation:hl .7s .5s forwards}
@keyframes hl{to{background-size:100% 100%}}
.ex{background:#fff;border-right:5px solid var(--uc);border-radius:10px;padding:calc(var(--u)*1.2) calc(var(--u)*2);margin:0 0 calc(var(--u)*1.2)}
.ex .s{font-size:calc(var(--u)*3.1);font-family:Amiri,Naskh,serif;line-height:1.8}
.ex .n{font-size:calc(var(--u)*2.3);color:var(--muted)}
.note{display:flex;gap:10px;background:#fff6d6;border:2px dashed #f5b700;border-radius:12px;padding:calc(var(--u)*1.4) calc(var(--u)*2);margin-top:calc(var(--u)*2)}
.note b{color:#b46900;white-space:nowrap}
.note span{font-size:calc(var(--u)*2.55);line-height:1.9}
.rv{opacity:0}
.live .rv{animation:rise .55s cubic-bezier(.2,.8,.3,1.2) both;animation-delay:calc(var(--i,0) * 110ms + 120ms)}
@keyframes rise{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:none}}
.hint{font-size:calc(var(--u)*2.2);color:var(--muted);text-align:center;margin-top:calc(var(--u)*2)}
.pill{display:inline-block;background:var(--uc);color:#fff;border-radius:999px;padding:2px 12px;font-size:calc(var(--u)*2.1)}

/* ---------- التدريبات ---------- */
.act{background:#fff;border-radius:14px;padding:calc(var(--u)*1.6) calc(var(--u)*2);margin:0 0 calc(var(--u)*1.8);box-shadow:0 3px 0 #eadfc9;position:relative}
.act .q{font-size:calc(var(--u)*2.75);font-weight:700;line-height:1.8;margin-bottom:calc(var(--u)*1)}
.qn{display:inline-grid;place-items:center;width:calc(var(--u)*3.2);height:calc(var(--u)*3.2);border-radius:8px;background:var(--uc);color:#fff;font-size:calc(var(--u)*1.9);margin-left:6px;vertical-align:middle}
.opts{display:flex;flex-wrap:wrap;gap:calc(var(--u)*1)}
.opt{flex:1 1 calc(50% - 10px);min-width:120px;border:2px solid #e4d6bb;background:#fffdf7;border-radius:12px;padding:calc(var(--u)*1) calc(var(--u)*1.4);font-size:calc(var(--u)*2.55);text-align:right;transition:transform .15s,background .2s,border-color .2s;color:var(--ink);line-height:1.6}
.opt:hover:not([disabled]){border-color:var(--uc);transform:translateY(-2px)}
.opt[disabled]{cursor:default}
.opt.ok{background:#dcfce7;border-color:var(--ok);color:#065f2a;animation:pop .35s}
.opt.bad{background:#ffe4e6;border-color:var(--bad);color:#9f1239;animation:shake .4s}
.opt.dim{opacity:.55}
.tfrow .opt{flex:0 1 160px;text-align:center;font-weight:700}
.fb{display:none;margin-top:calc(var(--u)*1.2);border-radius:10px;padding:calc(var(--u)*1) calc(var(--u)*1.6);font-size:calc(var(--u)*2.4);line-height:1.8;animation:rise .35s both}
.fb.show{display:block}
.fb.ok{background:#ecfdf3;color:#065f2a}
.fb.bad{background:#fff1f2;color:#9f1239}
@keyframes pop{50%{transform:scale(1.06)}}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.pool{display:flex;flex-wrap:wrap;gap:8px;min-height:44px;padding:8px;border-radius:12px;background:#f6efe0;margin-bottom:10px}
.chip{border:2px solid #d9c8a6;background:#fff;border-radius:999px;padding:4px 14px;font-size:calc(var(--u)*2.5);color:var(--ink);transition:transform .15s,box-shadow .15s}
.chip.sel{border-color:var(--uc);box-shadow:0 0 0 4px color-mix(in srgb,var(--uc) 25%,transparent);transform:translateY(-3px) scale(1.05)}
.chip.ok{background:#dcfce7;border-color:var(--ok);animation:pop .35s;cursor:default}
.chip.shake{animation:shake .4s;border-color:var(--bad);background:#ffe4e6}
.bins{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:8px}
.bin{border:2px dashed color-mix(in srgb,var(--uc) 60%,#fff);background:color-mix(in srgb,var(--uc) 6%,#fff);border-radius:14px;min-height:90px;padding:6px;text-align:center;transition:background .2s,transform .2s;cursor:pointer}
.bin h4{margin:0 0 6px;font-size:calc(var(--u)*2.4);color:var(--uc)}
.bin .chip{font-size:calc(var(--u)*2.1);padding:2px 10px;margin:2px}
.bin.ready{background:color-mix(in srgb,var(--uc) 16%,#fff);transform:scale(1.02)}
.words{display:flex;flex-wrap:wrap;gap:8px;font-family:Amiri,Naskh,serif;margin:6px 0 10px}
.word{border:2px solid #e4d6bb;background:#fffdf7;border-radius:10px;padding:2px 12px;font-size:calc(var(--u)*3.2);font-family:inherit;color:var(--ink)}
.word.on{background:#fff3c4;border-color:var(--gold)}
.word.ok{background:#dcfce7;border-color:var(--ok)}
.word.bad{background:#ffe4e6;border-color:var(--bad)}
.word.miss{border-color:var(--ok);border-style:dashed}
.btn{border:0;border-radius:12px;padding:calc(var(--u)*1) calc(var(--u)*2.4);font-size:calc(var(--u)*2.5);font-weight:700;background:var(--uc);color:#fff;box-shadow:0 3px 0 color-mix(in srgb,var(--uc) 60%,#000);transition:transform .15s}
.btn:active{transform:translateY(2px);box-shadow:none}
.btn.ghost{background:#efe4cd;color:var(--ink);box-shadow:0 3px 0 #d4c19c}
.score{display:flex;align-items:center;justify-content:space-between;gap:10px;background:color-mix(in srgb,var(--uc) 9%,#fff);border-radius:12px;padding:8px 14px;margin-bottom:12px;font-size:calc(var(--u)*2.3)}
.stars{letter-spacing:2px;font-size:calc(var(--u)*2.8)}
.stars .off{filter:grayscale(1);opacity:.3}
.stamp{position:absolute;left:8%;top:12%;transform:rotate(-14deg) scale(0);border:5px double #d6203a;color:#d6203a;font-family:Amiri,serif;font-size:calc(var(--u)*4.4);padding:2px 18px;border-radius:12px;z-index:5;pointer-events:none;background:#fff8;opacity:0}
.live .stamp.on{animation:stamp .6s .2s cubic-bezier(.3,1.6,.5,1) forwards}
@keyframes stamp{to{transform:rotate(-14deg) scale(1);opacity:.9}}

/* ---------- الغلاف والصفحات الخاصة ---------- */
.cover .pg-in{padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#fff;
  background:radial-gradient(circle at 30% 20%,#ff8a5b 0,transparent 45%),radial-gradient(circle at 80% 80%,#2ec4b6 0,transparent 45%),linear-gradient(160deg,#3a0ca3,#1d2b53 70%)}
.cover::after{display:none}
.cv-letters{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.cv-letters span{position:absolute;font-family:Amiri;color:#ffffff22;animation:float 7s ease-in-out infinite alternate;animation-delay:var(--dl)}
@keyframes float{to{transform:translateY(-18px) rotate(10deg)}}
.cv-badge{background:#ffd166;color:#3a0ca3;font-weight:800;border-radius:999px;padding:4px 18px;font-size:calc(var(--u)*2.4);position:relative}
.cv-title{font-family:Amiri,serif;font-size:calc(var(--u)*7.2);line-height:1.25;margin:calc(var(--u)*2) calc(var(--u)*3) calc(var(--u)*1);text-shadow:0 4px 18px #0006;position:relative}
.cv-sub{font-size:calc(var(--u)*2.7);opacity:.95;position:relative;margin:0 calc(var(--u)*4)}
.cv-book{font-size:calc(var(--u)*11);margin:calc(var(--u)*1) 0;animation:bob 3s ease-in-out infinite;position:relative}
@keyframes bob{50%{transform:translateY(-10px) rotate(-4deg)}}
.cv-by{font-size:calc(var(--u)*2.3);line-height:1.8;position:relative;opacity:.95}
.cv-by b{font-size:calc(var(--u)*2.8)}
.cv-free{margin-top:calc(var(--u)*1.2);font-size:calc(var(--u)*2.2);background:#ffffff22;border-radius:999px;padding:3px 16px;position:relative}
.cv-go{margin-top:calc(var(--u)*2.4);font-size:calc(var(--u)*3);padding:calc(var(--u)*1.2) calc(var(--u)*4);border-radius:999px;border:0;background:#ffd166;color:#3a0ca3;font-weight:800;box-shadow:0 6px 0 #c99a1d;position:relative;animation:pulse 2s infinite}
@keyframes pulse{50%{transform:scale(1.05)}}
.cv-visits{margin-top:calc(var(--u)*1.6);font-size:calc(var(--u)*2);opacity:.85;position:relative}
.udiv .pg-in{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#fff;background:radial-gradient(circle at 50% 30%,#ffffff33,transparent 60%),linear-gradient(160deg,var(--uc),color-mix(in srgb,var(--uc) 55%,#1d2b53))}
.udiv .big{font-size:calc(var(--u)*16);animation:bob 3s ease-in-out infinite}
.udiv h2{font-family:Amiri,serif;font-size:calc(var(--u)*7);margin:0}
.udiv small{font-size:calc(var(--u)*3);opacity:.9}
.udiv .cnt{margin-top:12px;font-size:calc(var(--u)*2.4);background:#ffffff26;border-radius:999px;padding:4px 18px}
.lnk{display:flex;align-items:center;gap:12px;width:100%;border:0;background:#fff;border-radius:14px;padding:calc(var(--u)*1.2) calc(var(--u)*1.8);margin-bottom:calc(var(--u)*1.2);box-shadow:0 3px 0 #eadfc9;font-size:calc(var(--u)*2.7);color:var(--ink);text-align:right;transition:transform .15s}
.lnk:hover{transform:translateX(-4px)}
.lnk .ic{font-size:calc(var(--u)*3.6)}
.lnk .t{flex:1}
.lnk .stars{font-size:calc(var(--u)*2.2)}
.toc-u{font-weight:800;color:var(--uc);margin:calc(var(--u)*1.8) 0 calc(var(--u)*.8);font-size:calc(var(--u)*2.8)}
.toc-l{display:flex;gap:8px;align-items:center;width:100%;border:0;background:transparent;border-bottom:1px dotted #d9c8a6;padding:5px 2px;font-size:calc(var(--u)*2.5);color:var(--ink);text-align:right}
.toc-l:hover{background:#fff}
.toc-l .t{flex:1}
.toc-l .pg{color:var(--muted);font-size:calc(var(--u)*2.1)}
.how li{margin-bottom:6px}
.kbd{display:inline-block;border:1px solid #cbb994;border-bottom-width:3px;border-radius:6px;padding:0 7px;background:#fff;font-size:.9em}
/* الاختبار */
.tq{font-size:calc(var(--u)*3);font-weight:700;line-height:1.8;margin:10px 0}
.prog{height:10px;border-radius:99px;background:#efe4cd;overflow:hidden;margin:6px 0 10px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,#f18f01,#e4572e);border-radius:99px;transition:width .4s}
.res-big{font-family:Amiri,serif;font-size:calc(var(--u)*9);text-align:center;color:var(--uc);line-height:1.2}
.res-msg{text-align:center;font-size:calc(var(--u)*3)}
.rev{background:#fff;border-radius:10px;padding:8px 12px;margin:8px 0;border-right:4px solid var(--bad);font-size:calc(var(--u)*2.3);line-height:1.8}
input.nm{font-family:inherit;font-size:calc(var(--u)*2.6);padding:8px 12px;border-radius:10px;border:2px solid #e4d6bb;width:100%;margin:6px 0 12px}

/* ---------- شريط الأدوات ---------- */
#bar{position:fixed;left:0;right:0;bottom:0;height:62px;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 10px;background:#0d1530cc;backdrop-filter:blur(8px);color:#fff;z-index:20}
#bar button{border:0;background:#ffffff1a;color:#fff;border-radius:12px;height:44px;min-width:44px;padding:0 12px;font-size:17px;display:flex;align-items:center;gap:6px;transition:background .2s}
#bar button:hover{background:#ffffff33}
#bar .nav{background:#ffd166;color:#3a0ca3;font-weight:800}
#bar .nav:disabled{opacity:.35}
#pgInfo{min-width:120px;text-align:center;font-size:14px;line-height:1.3;opacity:.95}
#pgInfo b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px}
@media (max-width:560px){#bar .lbl{display:none}#pgInfo{min-width:80px}#pgInfo b{max-width:120px;font-size:13px}#bar{gap:5px}#bar button{padding:0 9px}}
/* الدرج */
#drawer{position:fixed;inset:0;z-index:40;display:none}
#drawer.open{display:block}
#drawer .sh{position:absolute;inset:0;background:#0008;animation:fade .25s}
#drawer .pn{position:absolute;top:0;bottom:0;right:0;width:min(380px,90vw);background:var(--paper);padding:18px 18px 30px;overflow-y:auto;animation:slide .3s cubic-bezier(.2,.8,.3,1)}
@keyframes slide{from{transform:translateX(100%)}}
@keyframes fade{from{opacity:0}}
#drawer h3{margin:0 0 6px;font-family:Amiri,serif;font-size:24px}
#drawer .toc-l,#drawer .toc-u{font-size:16px}
.setrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.setrow button{border:0;border-radius:10px;padding:8px 12px;background:#efe4cd;font-size:15px}
/* نافذة الملاحظة */
#note{position:fixed;inset:0;z-index:50;background:#0009;display:flex;align-items:center;justify-content:center;padding:16px}
#note[hidden]{display:none}
#note form{background:var(--paper);border-radius:16px;padding:18px;width:min(460px,100%);max-height:92vh;overflow:auto}
#note h3{margin:0 0 6px;font-family:Amiri,serif;font-size:24px}
#note label{display:block;font-size:15px;margin:8px 0}
#note input,#note select,#note textarea{display:block;width:100%;margin-top:4px;font-family:inherit;font-size:16px;padding:8px;border-radius:10px;border:2px solid #e4d6bb;background:#fff}
#note .row{display:flex;gap:8px;justify-content:flex-start;margin-top:12px}
#note .row button{border:0;border-radius:10px;padding:10px 16px;font-size:16px;background:#efe4cd}
#note .row .go{background:#25d366;color:#fff;font-weight:700}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:60}

<body>

<script>
(function(){
'use strict';
var WA = '9647812346562';
var B = window.BOOK, $ = function(s,r){return (r||document).querySelector(s)}, $$ = function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
var ORD = ['الأولى','الثانية','الثالثة','الرابعة','الخامسة','السادسة'];
var LORD = ['الأول','الثاني','الثالث','الرابع','الخامس','السادس','السابع','الثامن','التاسع','العاشر','الحادي عشر','الثاني عشر','الثالث عشر','الرابع عشر','الخامس عشر','السادس عشر','السابع عشر','الثامن عشر','التاسع عشر','العشرون','الحادي والعشرون','الثاني والعشرون','الثالث والعشرون','الرابع والعشرون','الخامس والعشرون','السادس والعشرون'];
function ar(n){return String(n).replace(/\d/g,function(d){return '٠١٢٣٤٥٦٧٨٩'[d]})}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function mk(s){return s.replace(/\[\[(.+?)\]\]/g,'<mark class="m1">$1</mark>').replace(/\{\{(.+?)\}\}/g,'<mark class="m2">$1</mark>')}

/* ---------- التخزين ---------- */
var store = {get:function(k,d){try{var v=localStorage.getItem('ar6:'+k);return v?JSON.parse(v):d}catch(e){return d}},
             set:function(k,v){try{localStorage.setItem('ar6:'+k,JSON.stringify(v))}catch(e){}}};
var ANS = store.get('ans',{});      // ANS[lid][k] = {...}
var SND = store.get('snd',true);
var BEST = store.get('best',null);

/* ---------- الأصوات (مولّدة بالمتصفح) ---------- */
var AC=null;
function ac(){ if(!AC){ try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){} } if(AC&&AC.state==='suspended')AC.resume(); return AC; }
function tone(f,d,type,vol,when,f2){ var a=ac(); if(!a||!SND)return; var t=a.currentTime+(when||0);
  var o=a.createOscillator(), g=a.createGain(); o.type=type||'sine'; o.frequency.setValueAtTime(f,t); if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol||.2,t+.015); g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+d+.05); }
var noiseBuf=null;
var S = {
  flip:function(){ var a=ac(); if(!a||!SND)return; if(!noiseBuf){noiseBuf=a.createBuffer(1,a.sampleRate*.6,a.sampleRate);var d=noiseBuf.getChannelData(0);for(var i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,1.5);}
    var t=a.currentTime, s=a.createBufferSource(), f=a.createBiquadFilter(), g=a.createGain(); s.buffer=noiseBuf; f.type='bandpass'; f.Q.value=.8;
    f.frequency.setValueAtTime(3200,t); f.frequency.exponentialRampToValueAtTime(500,t+.5); g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(.35,t+.08); g.gain.exponentialRampToValueAtTime(0.0001,t+.55);
    s.connect(f); f.connect(g); g.connect(a.destination); s.start(t); },
  ok:function(){ tone(660,.14,'sine',.22); tone(990,.22,'sine',.2,.1); },
  bad:function(){ tone(220,.28,'square',.07,0,140); },
  tap:function(){ tone(900,.05,'triangle',.08); },
  pop:function(){ tone(500,.12,'sine',.12,0,950); },
  win:function(){ [523,659,784,1047].forEach(function(f,i){ tone(f,.25,'triangle',.16,i*.11); }); tone(1319,.5,'sine',.12,.48); }
};

/* ---------- بناء قائمة الصفحات ---------- */
var PAGES=[], LESSONS=[], LPAGE={};
PAGES.push({k:'cover',t:'الغلاف'});
PAGES.push({k:'how',t:'كيف تستعمل الكتاب'});
PAGES.push({k:'toc',t:'الفهرس'});
B.units.forEach(function(u,ui){
  PAGES.push({k:'udiv',u:ui,t:'الوحدة '+ORD[ui]});
  PAGES.push({k:'umap',u:ui,t:'دروس الوحدة '+ORD[ui]});
  u.lessons.forEach(function(l){ l.n=LESSONS.length; l.u=ui; LESSONS.push(l); LPAGE[l.id]=PAGES.length;
    PAGES.push({k:'la',u:ui,l:l,t:l.title}); PAGES.push({k:'lb',u:ui,l:l,t:'تدريبات: '+l.title}); });
});
var TESTP=PAGES.length; PAGES.push({k:'test',t:'الاختبار الشامل'});
PAGES.push({k:'back',t:'عن الكتاب'});
var N=PAGES.length;

/* ---------- حساب الدرجات ---------- */
function actScore(l,k){ var a=(ANS[l.id]||{})[k]; if(!a||!a.done)return null; var t=l.acts[k];
  if(t.type==='sort') return Math.max(0,1-(a.miss||0)/t.items.length); return a.ok?1:0; }
function lessonScore(l){ var s=0,d=0; l.acts.forEach(function(_,k){ var v=actScore(l,k); if(v!==null){s+=v;d++;} }); return {done:d,total:l.acts.length,score:d?s/l.acts.length:0}; }
function starsN(l){ var r=lessonScore(l); if(r.done<r.total)return r.done?0.5:0; return r.score>=.9?3:r.score>=.7?2:1; }
function starsHTML(l){ var n=starsN(l); var h='<span class="stars">'; for(var i=1;i<=3;i++) h+= i<=n?'⭐':'<span class="off">⭐</span>'; return h+'</span>'; }

/* ---------- قوالب الصفحات ---------- */
function ucolor(ui){ return ui==null?'#e4572e':B.units[ui].color; }
function pCover(){
  var L='أبتثجحخدذرزسشصضطظعغفقكلمنهوي', h='<div class="cv-letters">';
  for(var i=0;i<18;i++) h+='<span style="left:'+(Math.random()*92)+'%;top:'+(Math.random()*92)+'%;font-size:'+(26+Math.random()*50)+'px;--dl:-'+(Math.random()*6)+'s">'+L[Math.floor(Math.random()*L.length)]+'</span>';
  h+='</div><div class="cv-badge">الصف السادس الإعدادي</div><div class="cv-book">📗</div>'+
    '<div class="cv-title">أساسيات قواعد<br>اللغة العربية</div>'+
    '<div class="cv-sub">كتاب تفاعلي ملوّن: شرح متحرك، وتدريبات، واختبار شامل بتصحيح فوري</div>'+
    '<div class="cv-sub" style="margin-top:8px;font-size:calc(var(--u)*2.2);opacity:.85">الأساسيات وأسلوب الاستفهام — مبني على ملزمة الأستاذ علي مشتت</div>'+
    '<button class="cv-go" data-act="open">افتح الكتاب ←</button>'+
    '<div class="cv-by" style="margin-top:calc(var(--u)*2.4)">إعداد<br><b>البروفيسور عماد محمد فرحان</b><br>باستعمال المساعد الذكي كلاود (Claude)</div>'+
    '<div class="cv-free">مجاني للطلبة والأساتذة</div>'+
    '<div class="cv-visits" data-visits hidden>عدد الزيارات: <b></b></div>';
  return h;
}
function pHow(){
  return '<div class="band" data-ic="🧭"><small>قبل أن تبدأ</small><h2>كيف تستعمل الكتاب؟</h2></div>'+
  '<ul class="pts how">'+[
   'قلّب الصفحات بزرّي <b>التالية</b> و<b>السابقة</b> في الأسفل، أو بالضغط على طرف الورقة، أو بالسحب يمينًا على الهاتف.',
   'في لوحة المفاتيح: السهم <span class="kbd">←</span> للتالية، والسهم <span class="kbd">→</span> للسابقة.',
   'لكل درس صفحتان: صفحة <b>الشرح</b> بالأمثلة الملوّنة، وصفحة <b>التدريبات</b> بالتصحيح الفوري.',
   'أنواع التدريبات: اختيار من متعدد، وصح أو خطأ، وتصنيف الكلمات في سلال، واختيار كلمات من جملة.',
   'تحصل على نجوم ⭐ لكل درس، ويظهر ختم «أحسنت» حين تتقن التدريبات.',
   'في آخر الكتاب <b>اختبار شامل</b> من عشرين سؤالًا يتغيّر في كل مرة.',
   'زر ☰ يفتح الفهرس، وزر 🔊 للصوت، وزر ✉️ لإرسال ملاحظة إلى المؤلف عبر واتساب.'
  ].map(function(t,i){return '<li class="rv" style="--i:'+i+'" data-n="'+ar(i+1)+'">'+t+'</li>'}).join('')+'</ul>'+
  '<div class="note rv" style="--i:8"><b>للأستاذ:</b><span>صُحّحت في هذه النسخة بعض الهنات الواردة في الملزمة، وأُشير إلى كل تصحيح في موضعه بعنوان «تصحيح» أو «فائدة».</span></div>';
}
function tocHTML(inDrawer){
  var h='';
  B.units.forEach(function(u,ui){
    h+='<div class="toc-u" style="--uc:'+u.color+'">'+u.icon+' الوحدة '+ORD[ui]+': '+u.title+'</div>';
    u.lessons.forEach(function(l){ h+='<button class="toc-l" data-go="'+LPAGE[l.id]+'"><span>'+l.icon+'</span><span class="t">'+l.title+'</span>'+starsHTML(l)+'<span class="pg">'+ar(LPAGE[l.id])+'</span></button>'; });
  });
  h+='<div class="toc-u">🏆 الختام</div><button class="toc-l" data-go="'+TESTP+'"><span>📝</span><span class="t">الاختبار الشامل</span><span class="pg">'+(BEST!=null?'أفضل نتيجة: '+ar(BEST)+'٪':ar(TESTP))+'</span></button>';
  return h;
}
function pToc(){ return '<div class="band" data-ic="📚"><small>محتويات الكتاب</small><h2>الفهرس</h2></div><div class="rv" style="--i:1">'+tocHTML()+'</div>'; }
function pUdiv(ui){ var u=B.units[ui]; return '<div class="big">'+u.icon+'</div><small>الوحدة '+ORD[ui]+'</small><h2>'+u.title+'</h2><div class="cnt">'+ar(u.lessons.length)+' '+(u.lessons.length>2?'دروس':'درسان')+'</div>'; }
function pUmap(ui){ var u=B.units[ui];
  return '<div class="band" data-ic="'+u.icon+'"><small>الوحدة '+ORD[ui]+'</small><h2>دروس الوحدة</h2></div>'+
  u.lessons.map(function(l,i){ return '<button class="lnk rv" style="--i:'+i+'" data-go="'+LPAGE[l.id]+'"><span class="ic">'+l.icon+'</span><span class="t"><b>'+l.title+'</b><br><small style="color:var(--muted)">'+l.intro+'</small></span>'+starsHTML(l)+'</button>'; }).join('')+
  '<p class="hint rv" style="--i:'+(u.lessons.length+1)+'">اضغط على أي درس للانتقال إليه مباشرة.</p>';
}
function pLa(l){
  var i=0, h='<div class="band" data-ic="'+l.icon+'"><small>الدرس '+LORD[l.n]+'</small><h2>'+l.title+'</h2></div>';
  h+='<p class="intro rv" style="--i:'+(i++)+'">'+mk(l.intro)+'</p><h3 class="sec rv" style="--i:'+(i++)+'">📌 الخلاصة</h3><ul class="pts">';
  l.points.forEach(function(p,j){ h+='<li class="rv" style="--i:'+(i++)+'" data-n="'+ar(j+1)+'" data-act="glow">'+mk(p)+'</li>'; });
  h+='</ul>';
  if(l.examples&&l.examples.length){ h+='<h3 class="sec rv" style="--i:'+(i++)+'">✏️ أمثلة</h3>';
    l.examples.forEach(function(e){ h+='<div class="ex rv" style="--i:'+(i++)+'"><div class="s">'+mk(e.s)+'</div><div class="n">'+e.n+'</div></div>'; }); }
  if(l.note) h+='<div class="note rv" style="--i:'+(i++)+'"><b>💡 '+l.note.k+':</b><span>'+mk(l.note.t)+'</span></div>';
  h+='<p class="hint rv" style="--i:'+(i++)+'">التدريبات في الصفحة المقابلة ←</p>';
  return h;
}
function pLb(l){
  var r=lessonScore(l), n=starsN(l);
  var h='<div class="band" data-ic="🎯"><small>تدريبات الدرس '+LORD[l.n]+'</small><h2>'+l.title+'</h2></div>';
  h+='<div class="stamp'+(r.done===r.total&&r.score>=.7?' on':'')+'">أحسنت!</div>';
  h+='<div class="score rv" style="--i:0" data-score="'+l.id+'">'+scoreInner(l)+'</div>';
  l.acts.forEach(function(_,k){ h+='<div class="rv" style="--i:'+(k+1)+'">'+actHTML(l,k)+'</div>'; });
  h+='<div class="rv" style="--i:'+(l.acts.length+1)+';text-align:center"><button class="btn ghost" data-act="reset" data-l="'+l.id+'">↺ أعد التدريبات</button></div>';
  return h;
}
function scoreInner(l){ var r=lessonScore(l); return '<span>أنجزت '+ar(r.done)+' من '+ar(r.total)+(r.done===r.total?' — نتيجتك '+ar(Math.round(r.score*100))+'٪':'')+'</span>'+starsHTML(l); }

/* ---------- التدريبات ---------- */
function A(l,k){ ANS[l.id]=ANS[l.id]||{}; return ANS[l.id][k]=ANS[l.id][k]||{}; }
function actHTML(l,k){
  var t=l.acts[k], a=(ANS[l.id]||{})[k]||{}, h='<div class="act" data-l="'+l.id+'" data-k="'+k+'"><div class="q"><span class="qn">'+ar(k+1)+'</span>'+esc(t.q)+'</div>';
  if(t.type==='mcq'||t.type==='tf'){
    var opts = t.type==='tf'?['صح ✔','خطأ ✘']:t.o, ans = t.type==='tf'?(t.a?0:1):t.a;
    h+='<div class="opts'+(t.type==='tf'?' tfrow':'')+'">';
    opts.forEach(function(o,i){ var c=''; if(a.done){ if(i===ans)c=' ok'; else if(i===a.v)c=' bad'; else c=' dim'; }
      h+='<button class="opt'+c+'" data-act="opt" data-v="'+i+'"'+(a.done?' disabled':'')+'>'+esc(o)+'</button>'; });
    h+='</div>';
    if(a.done) h+='<div class="fb show '+(a.ok?'ok':'bad')+'">'+(a.ok?'✔ أحسنت! ':'✘ الإجابة الصحيحة: «'+esc(opts[ans])+'». ')+esc(t.e||'')+'</div>';
  } else if(t.type==='sort'){
    var pl=a.pl||{}, sel=(SEL&&SEL.l===l.id&&SEL.k===k)?SEL.i:-1;
    h+='<div class="pool">'; var left=0;
    t.items.forEach(function(it,i){ if(pl[i]==null){ left++; h+='<button class="chip'+(i===sel?' sel':'')+'" data-act="chip" data-v="'+i+'">'+esc(it[0])+'</button>'; } });
    if(!left) h+='<span style="color:var(--ok);font-weight:700;padding:4px 8px">✔ اكتمل التصنيف'+(a.miss?' (أخطاء: '+ar(a.miss)+')':' بلا أخطاء')+'</span>';
    h+='</div><div class="bins" style="--n:'+t.bins.length+'">';
    t.bins.forEach(function(b,bi){ h+='<div class="bin'+(sel>=0?' ready':'')+'" data-act="bin" data-v="'+bi+'"><h4>'+esc(b)+'</h4>';
      t.items.forEach(function(it,i){ if(pl[i]===bi) h+='<span class="chip ok">'+esc(it[0])+'</span>'; }); h+='</div>'; });
    h+='</div>';
  } else if(t.type==='pick'){
    var on=a.on||[];
    h+='<div class="words">';
    t.s.forEach(function(w,i){ var c=''; if(a.done){ var isA=t.a.indexOf(i)>=0, isOn=on.indexOf(i)>=0; c= isA&&isOn?' ok': isOn?' bad': isA?' miss':''; } else if(on.indexOf(i)>=0) c=' on';
      h+='<button class="word'+c+'" data-act="word" data-v="'+i+'"'+(a.done?' disabled':'')+'>'+esc(w)+'</button>'; });
    h+='</div>';
    if(!a.done) h+='<button class="btn" data-act="check">تحقّق</button>';
    else h+='<div class="fb show '+(a.ok?'ok':'bad')+'">'+(a.ok?'✔ أحسنت! ':'✘ الكلمات الصحيحة مؤطّرة بالأخضر. ')+esc(t.e||'')+'</div>';
  }
  return h+'</div>';
}
var SEL=null;
function lessonById(id){ for(var i=0;i<LESSONS.length;i++) if(LESSONS[i].id===id) return LESSONS[i]; }
function refreshAct(l,k,fx){
  $$('#book > .half .act[data-l="'+l.id+'"][data-k="'+k+'"]').forEach(function(el){ el.outerHTML=actHTML(l,k); });
  $$('#book > .half [data-score="'+l.id+'"]').forEach(function(el){ el.innerHTML=scoreInner(l); });
  if(fx) fx($('#book > .half .act[data-l="'+l.id+'"][data-k="'+k+'"]'));
}
function afterAnswer(l){
  store.set('ans',ANS);
  var r=lessonScore(l);
  if(r.done===r.total){
    var st=$('#book > .half .stamp');
    if(r.score>=.7){ if(st){st.classList.add('on')} S.win(); if(r.score>=.9) confetti(); toast('🎉 أتممت تدريبات «'+l.title+'» — '+ar(Math.round(r.score*100))+'٪'); }
    else toast('أتممت التدريبات. راجع الشرح وأعد المحاولة لتحصل على نجوم أكثر.');
  }
}
function onAct(el,act){
  var box=el.closest('.act'), l, k, t, a;
  if(box){ l=lessonById(box.dataset.l); k=+box.dataset.k; t=l.acts[k]; a=A(l,k); }
  var v=+el.dataset.v;
  if(act==='opt'){ if(a.done)return; var ans=t.type==='tf'?(t.a?0:1):t.a; a.done=true; a.v=v; a.ok=(v===ans); a.ok?S.ok():S.bad(); refreshAct(l,k); afterAnswer(l); }
  else if(act==='chip'){ SEL={l:l.id,k:k,i:v}; S.tap(); refreshAct(l,k); }
  else if(act==='bin'){
    if(!SEL||SEL.l!==l.id||SEL.k!==k){ toast('اختر كلمة أولًا ثم اضغط السلّة'); return; }
    var i=SEL.i; a.pl=a.pl||{};
    if(t.items[i][1]===v){ a.pl[i]=v; SEL=null; S.ok();
      if(Object.keys(a.pl).length===t.items.length){ a.done=true; refreshAct(l,k); afterAnswer(l); }
      else { refreshAct(l,k); store.set('ans',ANS); }
    } else { a.miss=(a.miss||0)+1; S.bad(); store.set('ans',ANS);
      refreshAct(l,k,function(box){ var c=box&&box.querySelector('.chip[data-v="'+i+'"]'); if(c){c.classList.add('shake');} var b=box&&box.querySelectorAll('.bin')[v]; if(b){b.style.animation='shake .4s'} }); }
  }
  else if(act==='word'){ if(a.done)return; a.on=a.on||[]; var p=a.on.indexOf(v); p>=0?a.on.splice(p,1):a.on.push(v); S.tap(); refreshAct(l,k); }
